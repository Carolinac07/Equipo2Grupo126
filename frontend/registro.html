<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <div class="login-tema">
        <button id="cambiarTema" class="boton-tema" type="button">
            ☾ Modo oscuro
        </button>
    </div>

    <main class="login">

        <img src="img/logoesc.png" alt="Escuela Técnica N° 1">

        <h1>Crear cuenta</h1>

        <p>Completá tus datos para registrarte.</p>

        <form id="formRegistro">

            <label for="nombre">Nombre</label>
            <input
                type="text"
                id="nombre"
                placeholder="Ingresá tu nombre"
                required
            >

            <label for="apellido">Apellido</label>
            <input
                type="text"
                id="apellido"
                placeholder="Ingresá tu apellido"
                required
            >

            <label for="usuario">Correo electrónico</label>
            <input
                type="email"
                id="usuario"
                placeholder="Ingresá tu correo electrónico"
                required
            >

            <label for="contraseña">Contraseña</label>
            <input
                type="password"
                id="contraseña"
                placeholder="Creá una contraseña"
                required
                minlength="6"
            >

            <button type="submit">Registrarme</button>

        </form>

        <p id="mensaje"></p>

        <p>
            ¿Ya tenés una cuenta?
            <a href="login.html">Iniciá sesión</a>
        </p>

        <span class="login-pie">Escuela Técnica N° 1</span>

    </main>

    <script src="js/tema.js"></script>
    <script src="js/registro.js"></script>

</body>
</html>
