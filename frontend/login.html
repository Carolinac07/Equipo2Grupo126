<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Computadoras</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <div class="login-tema">
        <button id="cambiarTema" class="boton-tema" type="button">
            ☾ Modo oscuro
        </button>
    </div>

    <main class="login">

        <img src="img/logoesc.png" alt="Escuela Técnica N° 1">

        <h1>Reserva de Computadoras</h1>

        <p>Ingresá tus datos para acceder al sistema.</p>

        <form id="formLogin">

            <label for="usuario">Correo electrónico</label>
            <input
                type="email"
                id="usuario"
                placeholder="Ingresá tu correo electrónico"
                required
            >

            <label for="contraseña">Contraseña</label>
            <input
                type="password"
                id="contraseña"
                placeholder="Ingresá tu contraseña"
                required
            >

            <button type="submit">Ingresar</button>

        </form>

        <p id="mensaje"></p>

        <p>
            ¿No tenés una cuenta?
            <a href="registro.html">Registrate acá</a>
        </p>

        <span class="login-pie">Escuela Técnica N° 1</span>

    </main>

    <script src="js/tema.js"></script>
    <script src="js/login.js"></script>

</body>
</html>
