<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar reservas</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

    <header class="encabezado">
        <div class="encabezado__logo">
            <img src="img/logoesc.png" alt="Escuela Técnica N° 1">

            <div>
                <h2>Escuela Técnica N° 1</h2>
                <p>Reserva de Computadoras</p>
            </div>
        </div>

        <div class="encabezado__acciones">
            <button id="cambiarTema" class="boton-tema" type="button">
                ☾ Modo oscuro
            </button>

            <button class="boton-salir" type="button" onclick="cerrarSesion()">
                Cerrar sesión
            </button>
        </div>
    </header>

    <main class="administracion">

        <h1>Administración de reservas</h1>

        <p class="descripcion">
            Desde acá podés consultar, cancelar y liberar las reservas.
        </p>

        <h2>Reservas registradas</h2>

        <div id="listaReservas"></div>

        <p id="mensaje"></p>

    </main>

    <script src="js/tema.js"></script>
    <script src="js/admin.js"></script>

</body>
</html>
